name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unified_org
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SUPPORT_HUB_URL: http://localhost:3000
          NEXT_PUBLIC_REVIEW_CONSOLE_URL: http://localhost:3001

      - name: Test
        run: pnpm test
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Upload auth-e2e build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auth-e2e-build
          retention-days: 1
          # Required: .next is a hidden directory and is skipped by default.
          include-hidden-files: true
          path: |
            apps/api/dist
            packages/types/dist
            apps/support-hub/.next
            apps/review-console/.next
            !apps/support-hub/.next/cache
            !apps/review-console/.next/cache

  auth-e2e:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unified_org
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-only-secret-min-32-chars-long!!
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unified_org
      DATABASE_APP_URL: postgresql://unified_app:unified_app@localhost:5432/unified_org
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SUPPORT_HUB_URL: http://localhost:3000
      NEXT_PUBLIC_REVIEW_CONSOLE_URL: http://localhost:3001
      API_PORT: "4000"
      # Prefer next start / node dist (artifacts from quality). Not next dev.
      AUTH_E2E_USE_PROD: "1"
      # Force non-Secure cookies on http://localhost (overrides NODE_ENV production default).
      COOKIE_SECURE: "false"
      AUTH_RATE_LIMIT_MAX: "1000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download auth-e2e build artifacts
        uses: actions/download-artifact@v4
        with:
          name: auth-e2e-build

      - name: Verify build artifacts
        run: |
          test -f apps/api/dist/index.js
          test -d apps/support-hub/.next
          test -d apps/review-console/.next
          test -d packages/types/dist
          echo "Build artifacts restored:"
          du -sh apps/api/dist packages/types/dist apps/support-hub/.next apps/review-console/.next

      - name: Generate Prisma client + migrate + seed
        run: |
          pnpm --filter @unified/db exec prisma generate
          pnpm --filter @unified/db exec prisma migrate deploy
          pnpm --filter @unified/db exec tsx prisma/seed.ts

      - name: Verify audit_logs append-only as unified_app
        run: pnpm --filter @unified/db test:audit-append-only

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run Newman + Playwright session sync
        run: bash scripts/run-auth-e2e.sh

  api-integration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unified_org
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-only-secret-min-32-chars-long!!
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unified_org
      DATABASE_APP_URL: postgresql://unified_app:unified_app@localhost:5432/unified_org
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      COOKIE_SECURE: "false"
      NODE_ENV: test
      AUTH_RATE_LIMIT_MAX: "1000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client + migrate
        run: |
          pnpm --filter @unified/db exec prisma generate
          pnpm --filter @unified/db exec prisma migrate deploy

      - name: Build API dependencies
        run: pnpm turbo build --filter=@unified/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unified_org

      - name: Run product BOLA gate
        run: pnpm test:bola

      - name: Upload BOLA gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-bola-junit
          retention-days: 7
          path: apps/api/test-results/bola.junit.xml

      - name: Run full API integration suite
        run: pnpm --filter @unified/api test:integration

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-integration-junit
          retention-days: 7
          path: apps/api/test-results/integration.junit.xml

  docker-smoke:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: apps/api/Dockerfile
            build_args: ""
          - name: support-hub
            file: apps/support-hub/Dockerfile
            build_args: |
              NEXT_PUBLIC_SUPPORT_HUB_URL=https://hub.example.com
              NEXT_PUBLIC_REVIEW_CONSOLE_URL=https://console.example.com
              NEXT_PUBLIC_API_URL=https://api.example.com
          - name: review-console
            file: apps/review-console/Dockerfile
            build_args: |
              NEXT_PUBLIC_REVIEW_CONSOLE_URL=https://console.example.com
              NEXT_PUBLIC_SUPPORT_HUB_URL=https://hub.example.com
              NEXT_PUBLIC_API_URL=https://api.example.com
          - name: db-migrate
            file: packages/db/Dockerfile
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: unified-org/${{ matrix.name }}:ci-smoke
          build-args: ${{ matrix.build_args }}
