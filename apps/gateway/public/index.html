<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unified Org Workspace</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #12202e;
        --muted: #4a5d70;
        --surface: #f3f6f4;
        --accent: #0f6b5c;
        --accent-hover: #0b5247;
        --line: rgba(18, 32, 46, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Source Sans 3", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(15, 107, 92, 0.14), transparent 55%),
          radial-gradient(900px 500px at 100% 0%, rgba(18, 32, 46, 0.08), transparent 50%),
          linear-gradient(165deg, #eef3f0 0%, var(--surface) 45%, #e7ecea 100%);
      }

      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 3rem 1.5rem 4rem;
        max-width: 40rem;
        margin: 0 auto;
      }

      h1 {
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(2.35rem, 7vw, 3.4rem);
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin: 0 0 0.85rem;
      }

      .lede {
        margin: 0 0 2.5rem;
        font-size: 1.125rem;
        line-height: 1.45;
        color: var(--muted);
        max-width: 28rem;
      }

      nav {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        border-top: 1px solid var(--line);
        padding-top: 1.75rem;
      }

      a {
        display: inline-flex;
        align-items: baseline;
        gap: 0.65rem;
        width: fit-content;
        color: var(--accent);
        font-size: 1.2rem;
        font-weight: 600;
        text-decoration: none;
        border-bottom: 2px solid transparent;
        padding-bottom: 0.1rem;
        transition: color 0.15s ease, border-color 0.15s ease;
      }

      a:hover,
      a:focus-visible {
        color: var(--accent-hover);
        border-bottom-color: currentColor;
        outline: none;
      }

      a span {
        font-size: 0.95rem;
        font-weight: 400;
        color: var(--muted);
      }

      @media (min-width: 540px) {
        main {
          padding-left: 2.5rem;
          padding-right: 2.5rem;
        }

        nav {
          flex-direction: row;
          gap: 2.25rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Unified Org Workspace</h1>
      <p class="lede">
        Shared identity across Support Hub and Review Console — pick a dashboard to continue.
      </p>
      <nav aria-label="Dashboards">
        <a href="/support-hub">Support Hub <span>tickets</span></a>
        <a href="/console">Review Console <span>audit</span></a>
      </nav>
    </main>
  </body>
</html>
